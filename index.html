<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANOPY AI PRO | Інженерна панель</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="glass-nav">
        <div class="logo">CANOPY<span>AI</span></div>
        <div class="status">SYSTEM: ONLINE</div>
    </nav>

    <main class="app-container">
        <section class="control-panel">
            <div class="card">
                <h3>📐 ПАРАМЕТРИ КОНСТРУКЦІЇ</h3>
                <div class="input-group">
                    <label>Довжина (м):</label>
                    <input type="number" id="length" value="5.0" step="0.1">
                </div>
                <div class="input-group">
                    <label>Ширина (м):</label>
                    <input type="number" id="width" value="4.8" step="0.1">
                </div>
                <div class="input-group">
                    <label>Ціна металу (грн/м):</label>
                    <input type="number" id="price" value="180">
                </div>
                <button onclick="updateProject()" class="btn-update">ОНОВИТИ РОЗРАХУНОК</button>
            </div>

            <div class="card result-card">
                <h3>📊 РЕЗУЛЬТАТИ</h3>
                <div id="results">
                    <div class="res-item">Вага: <span id="res-weight">0</span> кг</div>
                    <div class="res-item">Навантаження: <span id="res-load">0</span> кг/м²</div>
                    <div class="res-item cost">Вартість: <span id="res-cost">0</span> грн</div>
                </div>
            </div>

            <div class="card">
                <h3>📸 PHOTO-TO-3D (AI SCAN)</h3>
                <div class="upload-zone" onclick="document.getElementById('photo-input').click()">
                    <span>Клікніть для завантаження фото навісу</span>
                    <input type="file" id="photo-input" hidden accept="image/*">
                </div>
                <p class="hint">Система проаналізує фото та адаптує 3D модель</p>
            </div>
        </section>

        <section class="visualizer">
            <div id="canvas-3d"></div>
            <div class="overlay-info">3D REAL-TIME RENDER</div>
        </section>
    </main>

    <script src="engine.js"></script>
</body>
</html>
